networks:
  lan_access:
    driver: bridge

services:
  app:
    build:
      context: .
      args:
        BUILD_ENV: prod
      target: container-prod
      network: host
    env_file:
      - .env.production
    environment:
      POETRY_VIRTUALENVS_CREATE: "false"
      POETRY_VIRTUALENVS_IN_PROJECT: "false"
    volumes:
      - .:/app/
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      uwsgi --http 0.0.0.0:8002
      --module root.wsgi:application
      --master
      --processes 4
      --threads 2
      --harakiri 60
      --max-requests 5000
    expose:
      - "8002"
    networks:
      - default

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - default

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    volumes:
      - postgres_db:/var/lib/postgresql/data
    networks:
      - lan_access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d db"]
      interval: 5s
      timeout: 5s
      retries: 100

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_db:
