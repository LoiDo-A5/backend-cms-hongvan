name: ward

networks:
  lan_access:
    driver: bridge

services:
  app:
    build:
      context: .
      args:
        BUILD_ENV: prod
      target: container-prod
      network: host
    env_file:
      - .env.production
    environment:
      POETRY_VIRTUALENVS_CREATE: "false"
      POETRY_VIRTUALENVS_IN_PROJECT: "false"
    volumes:
      - .:/app/
      - /mnt/docker-nfs/cms-media:/mnt/docker-nfs/cms-media
    depends_on:
      redis:
        condition: service_healthy
    command: >
      uwsgi --http 0.0.0.0:8002
      --module root.wsgi:application
      --master
      --processes 4
      --threads 2
      --harakiri 60
      --max-requests 5000
    expose:
      - "8002"
    networks:
      - default
      - lan_access
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8002)); s.close()\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./static:/app/static:ro
      - /mnt/docker-nfs/cms-media:/mnt/docker-nfs/cms-media:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  redis:
    image: redis:7-alpine
    networks:
      - lan_access
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
