name: cms-backend-prod

networks:
  proxy:
    driver: bridge

services:
  app:
    build:
      context: .
      args:
        BUILD_ENV: prod
      target: container-prod
      network: host
    environment:
      POETRY_VIRTUALENVS_CREATE: "false"
      POETRY_VIRTUALENVS_IN_PROJECT: "false"
    volumes:
      - ./app:/app
      - /mnt/docker-nfs/cms-media:/media
    depends_on:
      redis:
        condition: service_healthy
    command: >
      uwsgi --http 0.0.0.0:8002
      --module root.wsgi:application
      --master
      --processes 4
      --threads 2
      --harakiri 60
      --max-requests 5000
    expose:
      - "8002"
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8002)); s.close()\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5   
    networks:
      - proxy
