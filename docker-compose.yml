networks:
  lan_access:
    driver: bridge

services:
  app:
    build:
      context: .
      args:
        BUILD_ENV: dev
      target: container-dev
      network: host
    # Tránh mount .venv Windows → Linux: poetry run tạo lại .venv trống → không có Django.
    # Khớp Dockerfile (poetry config virtualenvs.create false): dùng Python system trong image.
    environment:
      POETRY_VIRTUALENVS_CREATE: "false"
      POETRY_VIRTUALENVS_IN_PROJECT: "false"
    volumes:
      - .:/app/
      - ~/.ssh:/root/.ssh
      - backend_env:/root/.cache/
    depends_on:
      redis:
          condition: service_healthy
      postgres:
          condition: service_healthy
    command: ["python", "manage.py", "runserver", "0.0.0.0:8002"]
    ports:
      - "8000:8000"
    networks:
      - lan_access
      - default
  postgres:
    # Alpine: manifest đa kiến trúc ổn định (amd64 + arm64). Không set platform để Docker chọn đúng CPU máy bạn.
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    volumes:
      - postgres_db:/var/lib/postgresql/data
    networks:
      - lan_access
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d db" ]
      interval: 5s
      timeout: 5s
      retries: 100
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1884:1883"
    networks:
      - lan_access

volumes:
  postgres_db:
  backend_env:
